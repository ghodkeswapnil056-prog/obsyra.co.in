<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Master HR Control Center | Obsyra Pvt Ltd</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body style="background: linear-gradient(135deg, #0b1329 0%, #0f172a 100%); min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white;">
  <main style="width: 100%; max-width: 440px; padding: 1.5rem;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <a href="../index.html" class="nav-brand" style="justify-content: center; font-size: 1.8rem; margin-bottom: 0.5rem;"><span style="color:#38bdf8;">OBSYRA</span> PVT LTD</a>
      <div style="font-size: 0.85rem; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px;">Master HR Control Center</div>
    </div>

    <div class="form-card" style="background: rgba(15, 23, 42, 0.9); border: 1px solid #334155; box-shadow: 0 20px 50px rgba(0,0,0,0.5);">
      <div style="text-align: center; margin-bottom: 1.5rem;">
        <span class="security-shield-badge">🔒 256-BIT ENCRYPTED ADMIN GATE</span>
        <h2 style="font-size: 1.4rem; font-weight: 800; margin-top: 0.5rem; color: white;">ADMIN RECRUITMENT LOGIN</h2>
        <p style="font-size: 0.85rem; color: #94a3b8; margin-top: 0.35rem;">Enter authorized HR Recruiter or Super Admin credentials.</p>
      </div>

      <form id="adminLoginForm" onsubmit="handleAdminLogin(event)">
        <div class="form-group">
          <label style="color: #cbd5e1;">Admin Email Address *</label>
          <input type="email" id="adminEmail" class="form-control" placeholder="e.g. admin@obsyra.com" required style="background:#0b1329; color:white; border-color:#334155;">
        </div>

        <div class="form-group">
          <label style="color: #cbd5e1;">Password *</label>
          <input type="password" id="adminPassword" class="form-control" placeholder="Enter password" required style="background:#0b1329; color:white; border-color:#334155;">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; font-size: 1rem; font-weight: 800; padding: 0.85rem;">ACCESS CONTROL CENTER →</button>
      </form>
    </div>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.8rem; color: #64748b;">
      &copy; 2026 Obsyra Pvt Ltd. Wagholi, Pune, Maharashtra, India.
    </div>
  </main>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/security-vault.js"></script>
  <script>
    async function handleAdminLogin(e) {
      e.preventDefault();
      const email = document.getElementById('adminEmail').value.trim();
      const password = document.getElementById('adminPassword').value;

      const adminUser = AUTH.validateAdminCredentials(email, password);

      if (adminUser) {
        AUTH.setAdminSession(adminUser);
        alert(`✓ Welcome ${adminUser.name}! Access granted to Master HR Control Center.`);
        window.location.href = 'dashboard.html';
      } else {
        alert('❌ Invalid Admin Credentials! Access Denied.');
      }
    }
  </script>
</body>
</html>
