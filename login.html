<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Candidate Login — Obsyra Portal</title>
  <link rel="stylesheet" href="css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body style="background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem;">
  
  <div class="form-card" style="max-width: 440px; width: 100%; padding: 2.25rem; border-radius: var(--radius-md); box-shadow: var(--shadow-lg);">
    <div style="text-align: center; margin-bottom: 1.75rem;">
      <a href="index.html" class="nav-brand" style="justify-content: center; font-size: 1.6rem; color: var(--dark); font-weight: 800; text-decoration: none;">
        <span style="color:var(--primary);">OBSYRA</span> PORTAL
      </a>
      <h1 style="font-size: 1.35rem; font-weight: 800; color: var(--dark); margin-top: 0.5rem;">Candidate Login</h1>
      <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0.25rem;">Access your dashboard, applications, resume, and scheduled interviews.</p>
    </div>

    <!-- ERROR ALERT -->
    <div id="loginErrorAlert" style="display:none; background:#fee2e2; border:1px solid #f87171; color:#991b1b; padding:0.85rem; border-radius:6px; font-size:0.85rem; margin-bottom:1.25rem;"></div>

    <form id="formLogin" onsubmit="event.preventDefault(); handleLoginSubmit();">
      <div class="form-group">
        <label>Email Address or Mobile Number *</label>
        <input type="text" id="loginUsername" class="form-control" placeholder="name@example.com or 9876543210" required>
      </div>

      <div class="form-group">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.35rem;">
          <label style="margin-bottom:0;">Password *</label>
          <a href="#" onclick="document.getElementById('forgotModal').classList.add('show')" style="font-size:0.78rem; font-weight:600;">Forgot Password?</a>
        </div>
        <div style="position:relative;">
          <input type="password" id="loginPass" class="form-control" placeholder="Enter your password" required>
          <button type="button" onclick="togglePassVisibility('loginPass', this)" style="position:absolute; right:10px; top:50%; transform:translateY(-50%); border:none; background:transparent; cursor:pointer; font-size:1.1rem;">👁</button>
        </div>
      </div>

      <div class="form-group" style="margin-bottom: 1.25rem;">
        <label style="display:flex; align-items:center; gap:0.5rem; font-size:0.825rem; font-weight:normal; color:var(--text-muted); cursor:pointer;">
          <input type="checkbox" checked>
          <span>Remember Me</span>
        </label>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; font-size: 0.95rem; font-weight: 800;">LOGIN TO CANDIDATE PORTAL</button>
      <button type="button" onclick="resetCandidateSession()" class="btn btn-outline" style="width: 100%; margin-top: 0.65rem; color: #64748b; border-color: #cbd5e1; font-size:0.8rem;">🧹 Reset Session & Clear Token Cache</button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; border-top: 1px solid #e2e8f0; padding-top: 1rem; font-size: 0.85rem; color: var(--text-muted);">
      Don't have a candidate account? <a href="register.html" style="font-weight: 700; color: var(--primary);">CREATE ACCOUNT →</a>
    </div>
  </div>

  <!-- FORGOT PASSWORD MODAL -->
  <div id="forgotModal" class="modal-overlay">
    <div class="modal-content">
      <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #e2e8f0; padding-bottom:0.75rem; margin-bottom:1rem;">
        <h3 style="font-size:1.15rem; font-weight:800;">🔒 Reset Password</h3>
        <button onclick="document.getElementById('forgotModal').classList.remove('show')" style="border:none; background:transparent; font-size:1.2rem; cursor:pointer;">✕</button>
      </div>

      <form onsubmit="event.preventDefault(); API.request('resetPassword', {email: document.getElementById('forgotEmail').value}).then(r => { alert(r.message); document.getElementById('forgotModal').classList.remove('show'); });">
        <p style="font-size:0.85rem; color:var(--text-muted); margin-bottom:1rem;">Enter your registered Email or Mobile Number. We will send a secure password reset link.</p>
        <div class="form-group">
          <label>Registered Email or Mobile *</label>
          <input type="text" id="forgotEmail" class="form-control" placeholder="name@example.com" required>
        </div>
        <div style="display:flex; justify-content:flex-end; gap:0.5rem;">
          <button type="button" onclick="document.getElementById('forgotModal').classList.remove('show')" class="btn btn-outline" style="color:var(--dark); border-color:#cbd5e1;">Cancel</button>
          <button type="submit" class="btn btn-primary">Send Reset Link</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    function togglePassVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        btn.innerText = '🙈';
      } else {
        input.type = 'password';
        btn.innerText = '👁';
      }
    }

    async function handleLoginSubmit() {
      const errAlert = document.getElementById('loginErrorAlert');
      errAlert.style.display = 'none';

      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPass').value;

      const res = await API.request('loginCandidate', { username, password });

      if (!res.success) {
        if (typeof AUTH !== 'undefined') AUTH.clearCandidateSession();
        errAlert.innerHTML = res.message;
        errAlert.style.display = 'block';
      } else {
        AUTH.setSession(res.candidate);
        alert(`✓ Welcome back, ${res.candidate.fullName}!`);
        window.location.href = 'candidate-dashboard.html';
      }
    }

    function resetCandidateSession() {
      if (typeof AUTH !== 'undefined') AUTH.clearCandidateSession();
      alert('✓ Browser candidate session and token cache have been completely reset.');
      window.location.reload();
    }
  </script>
</body>
</html>
