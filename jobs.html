<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find Your Next Job — Obsyra Marketplace</title>
  <link rel="stylesheet" href="css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <!-- PUBLIC NAVIGATION HEADER -->
  <nav class="navbar">
    <a href="index.html" class="nav-brand"><span style="color:var(--primary);">OBSYRA</span> PVT LTD</a>
    <ul class="nav-menu">
      <li><a href="index.html">Home</a></li>
      <li><a href="jobs.html" class="active">Jobs</a></li>
      <li><a href="about.html">About Us</a></li>
      <li><a href="services.html">Services</a></li>
      <li><a href="careers.html">Careers</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
    <div class="nav-auth" id="navAuth"></div>
  </nav>

  <!-- 1. JOBS SEARCH HEADER & 2-TIER PANEL -->
  <header style="background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: white; padding: 3rem 1.5rem; text-align: center;">
    <div style="max-width: 1050px; margin: 0 auto;">
      <h1 style="font-size: 2.25rem; font-weight: 800;">FIND YOUR NEXT JOB</h1>
      <p style="color: #94a3b8; font-size: 1rem; margin: 0.5rem 0 1.5rem 0;">Search available open vacancies across India by state location, department, experience, and skills.</p>
      
      <!-- 2-TIER SEARCH BAR PANEL -->
      <div class="form-card" style="background: white; color: var(--dark); padding: 1.5rem; text-align: left; margin: 0 auto; box-shadow: var(--shadow-lg);">
        
        <!-- ROW 1: PRIMARY FILTERS -->
        <div class="form-grid" style="grid-template-columns: 2fr 1.25fr 1fr 1.25fr; margin-bottom: 0.85rem;">
          <div class="form-group" style="margin:0;">
            <label style="font-size:0.75rem; font-weight:700;">Job Title / Skill / Keyword</label>
            <input type="text" id="searchQuery" class="form-control" placeholder="🔎 Network Engineer, 5G, Software Developer..." oninput="APP.filterJobs()">
          </div>

          <div class="form-group" style="margin:0;">
            <label style="font-size:0.75rem; font-weight:700;">State / Location *</label>
            <select id="searchState" class="form-control" onchange="APP.onStateChange()">
              <option value="">All Locations (28 States & UTs)</option>
              <optgroup label="States">
                <option value="Andhra Pradesh">Andhra Pradesh</option>
                <option value="Arunachal Pradesh">Arunachal Pradesh</option>
                <option value="Assam">Assam</option>
                <option value="Bihar">Bihar</option>
                <option value="Chhattisgarh">Chhattisgarh</option>
                <option value="Goa">Goa</option>
                <option value="Gujarat">Gujarat</option>
                <option value="Haryana">Haryana</option>
                <option value="Himachal Pradesh">Himachal Pradesh</option>
                <option value="Jharkhand">Jharkhand</option>
                <option value="Karnataka">Karnataka</option>
                <option value="Kerala">Kerala</option>
                <option value="Madhya Pradesh">Madhya Pradesh</option>
                <option value="Maharashtra" selected>Maharashtra</option>
                <option value="Manipur">Manipur</option>
                <option value="Meghalaya">Meghalaya</option>
                <option value="Mizoram">Mizoram</option>
                <option value="Nagaland">Nagaland</option>
                <option value="Odisha">Odisha</option>
                <option value="Punjab">Punjab</option>
                <option value="Rajasthan">Rajasthan</option>
                <option value="Sikkim">Sikkim</option>
                <option value="Tamil Nadu">Tamil Nadu</option>
                <option value="Telangana">Telangana</option>
                <option value="Tripura">Tripura</option>
                <option value="Uttar Pradesh">Uttar Pradesh</option>
                <option value="Uttarakhand">Uttarakhand</option>
                <option value="West Bengal">West Bengal</option>
              </optgroup>
              <optgroup label="Union Territories">
                <option value="Andaman and Nicobar Islands">Andaman and Nicobar Islands</option>
                <option value="Chandigarh">Chandigarh</option>
                <option value="Dadra and Nagar Haveli and Daman and Diu">Dadra and Nagar Haveli and Daman and Diu</option>
                <option value="Delhi">Delhi NCR</option>
                <option value="Jammu and Kashmir">Jammu and Kashmir</option>
                <option value="Ladakh">Ladakh</option>
                <option value="Lakshadweep">Lakshadweep</option>
                <option value="Puducherry">Puducherry</option>
              </optgroup>
              <optgroup label="Nationwide">
                <option value="PAN India">PAN India (Multiple Sites)</option>
              </optgroup>
            </select>
          </div>

          <div class="form-group" style="margin:0;">
            <label style="font-size:0.75rem; font-weight:700;">City (Cascade)</label>
            <select id="searchCity" class="form-control" onchange="APP.filterJobs()">
              <option value="">All Cities</option>
              <option value="Pune">Pune</option>
              <option value="Mumbai">Mumbai</option>
              <option value="Nagpur">Nagpur</option>
              <option value="Nashik">Nashik</option>
            </select>
          </div>

          <div class="form-group" style="margin:0;">
            <label style="font-size:0.75rem; font-weight:700;">Department</label>
            <select id="searchDept" class="form-control" onchange="APP.filterJobs()">
              <option value="">All Departments</option>
              <option value="Telecom">Telecom</option>
              <option value="Testing">Testing</option>
              <option value="Infrastructure">Infrastructure</option>
              <option value="Software">Software</option>
              <option value="IT Support">IT Support</option>
              <option value="Engineering">Engineering</option>
              <option value="Operations">Operations</option>
            </select>
          </div>
        </div>

        <!-- ROW 2: ADVANCED SECONDARY FILTERS -->
        <div class="form-grid" style="grid-template-columns: 1fr 1fr 1fr 1fr 1.25fr; align-items:flex-end;">
          <div class="form-group" style="margin:0;">
            <label style="font-size:0.75rem; font-weight:700;">Experience</label>
            <select id="searchExp" class="form-control" onchange="APP.filterJobs()">
              <option value="">All Experience</option>
              <option value="Fresher">Fresher</option>
              <option value="0–1 Years">0–1 Years</option>
              <option value="1–3 Years">1–3 Years</option>
              <option value="3–5 Years">3–5 Years</option>
              <option value="5–10 Years">5–10 Years</option>
              <option value="10+ Years">10+ Years</option>
            </select>
          </div>

          <div class="form-group" style="margin:0;">
            <label style="font-size:0.75rem; font-weight:700;">Job Type</label>
            <select id="searchType" class="form-control" onchange="APP.filterJobs()">
              <option value="">All Job Types</option>
              <option value="Full Time">Full Time</option>
              <option value="Part Time">Part Time</option>
              <option value="Contract">Contract</option>
              <option value="Temporary">Temporary</option>
              <option value="Internship">Internship</option>
              <option value="Project Based">Project Based</option>
            </select>
          </div>

          <div class="form-group" style="margin:0;">
            <label style="font-size:0.75rem; font-weight:700;">Work Mode</label>
            <select id="searchMode" class="form-control" onchange="APP.filterJobs()">
              <option value="">All Work Modes</option>
              <option value="On-Site">On-Site</option>
              <option value="Remote">Remote</option>
              <option value="Hybrid">Hybrid</option>
              <option value="Field Work">Field Work</option>
            </select>
          </div>

          <div class="form-group" style="margin:0;">
            <label style="font-size:0.75rem; font-weight:700;">Posted Date</label>
            <select id="searchDate" class="form-control" onchange="APP.filterJobs()">
              <option value="">Any Time</option>
              <option value="24h">Past 24 Hours</option>
              <option value="week">Past Week</option>
              <option value="month">Past Month</option>
            </select>
          </div>

          <div style="display:flex; gap:0.5rem;">
            <button onclick="APP.filterJobs()" class="btn btn-primary" style="flex:1;">🔍 SEARCH</button>
            <button onclick="APP.clearSearch()" class="btn btn-outline" style="color:var(--dark); border-color:#cbd5e1; font-size:0.8rem;">CLEAR</button>
          </div>
        </div>

      </div>
    </div>
  </header>

  <main class="container">
    <!-- FEATURED JOBS SHOWCASE -->
    <div style="margin-bottom: 2rem;">
      <h3 style="font-size: 1.2rem; font-weight: 800; color: var(--dark); margin-bottom: 0.75rem;">🔥 Featured Opportunities</h3>
      <div id="featuredJobsContainer" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1rem;">
        <!-- Rendered dynamically by app.js -->
      </div>
    </div>

    <!-- SEARCH RESULTS HEADER -->
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; flex-wrap:wrap; gap:1rem;">
      <h2 style="font-size: 1.35rem; font-weight: 800; color: var(--dark);" id="jobsCountText">4 Jobs Found</h2>
      <div style="display:flex; align-items:center; gap:0.5rem; font-size:0.85rem;">
        <span>Sort By:</span>
        <select class="form-control" style="width:160px; padding:0.35rem 0.6rem; font-size:0.85rem;" onchange="APP.filterJobs()">
          <option value="newest">Newest First</option>
          <option value="relevance">Relevance</option>
          <option value="deadline">Closing Soon</option>
        </select>
      </div>
    </div>

    <!-- JOB CARDS GRID & EMPTY STATE CONTAINER -->
    <div id="jobsGridContainer">
      <!-- Rendered dynamically by app.js -->
    </div>
  </main>

  <footer class="footer">
    <div class="footer-bottom">&copy; 2026 Obsyra Pvt Ltd. All rights reserved.</div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      APP.initJobsMarketplace();
    });
  </script>
</body>
</html>
